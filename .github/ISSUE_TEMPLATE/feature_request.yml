name: Feature request
description: Propose a product or engineering capability with testable acceptance criteria.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe one independently deliverable feature. Do not include credentials, personal data, or sensitive security details.
  - type: textarea
    id: problem
    attributes:
      label: Problem and context
      description: Who has this problem, and what happens today?
      placeholder: As a [user], I need [capability] because [reason].
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior or outcome, not an implementation prescription unless necessary.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes, including validation and authorization behavior.
      placeholder: |
        - Given ..., when ..., then ...
        - Given ..., when ..., then ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Identify affected apps/modules and what is explicitly out of scope.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Test plan
      description: Specify automated tests and any manual verification needed.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and data impact
      description: Note API/schema changes, migration, compatibility, rollout, or rollback needs; use "None" when not applicable.
    validations:
      required: true
